ld-overlay"></div><div class="bg-label">Blender 实渲叠加 · 非引擎运行截图</div><div class="ui"></div></div></div><div class="notes">当前交付：三独立场景的自由探索界面。没有任务树、收集进度、经营数值或通关门槛。<br>页面可演示场景选择、滑块、帮助与拍照状态；不是游戏。旧交班版只在 _旧版任务UI留档，不应接入主流程。</div></div><script>const screens={"title":"<header class=\"brandline\"><span>OPEN / NIGHT HOURS</span><span>灯还亮着。</span></header><section class=\"title\"><div class=\"eyebrow\">一款没有急事的奇怪小店漫游</div><h1>这店<span>不太对</span><i>。</i></h1><p>随便走走。奇怪的事情就在旁边。</p></section><section class=\"levelcards\"><button class=\"levelcard l1\" data-level=\"L1\"><div class=\"level-index\">01<span>第一眼就能看见</span></div><h2>便民店初访</h2><p>门一开，熟悉的小店先露出一点不对劲。</p><footer>进去看看 <span>↗</span></footer></button><button class=\"levelcard l2\" data-level=\"L2\"><div class=\"level-index\">02<span>转个角，再回头</span></div><h2>后仓夜游</h2><p>挪一步，换个方向，普通物件各有想法。</p><footer>进去看看 <span>↗</span></footer></button><button class=\"levelcard l3\" data-level=\"L3\"><div class=\"level-index\">03<span>这次不只一个</span></div><h2>整店不对劲</h2><p>一个小动静，让整间店互相接了话。</p><footer>进去看看 <span>↗</span></footer></button></section><footer class=\"titlefoot\"><span>三个独立场景 · 自由进入与离开 · 不计时、不评分</span><button data-action=\"pause\">声音设置 <img alt=\"\" src=\"Sprites/I3_Icon_Volume.png\"></button></footer>","hud":"<div class=\"location\"><span class=\"small-square\"></span><span data-location>L1 · 便民店初访</span></div><div class=\"cross\"><img alt=\"\" src=\"Sprites/I3_Crosshair_Interact.png\"></div><div class=\"interact\"><kbd>E</kbd><span>看一看</span></div><div class=\"bottom\"><span><kbd>Tab</kbd> 看操作</span><span><kbd>P</kbd> 拍照　<kbd>Esc</kbd> 暂停</span></div>","help":"<div class=\"shade\"></div><section class=\"panel help\"><div class=\"eyebrow\">不用着急，也没有标准答案。</div><h2>随便走走就好</h2><div class=\"keyrows\"><div><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><strong>走动</strong></div><div><span>鼠标</span><strong>环顾四周</strong></div><div><span><kbd>E</kbd></span><strong>看一看 / 试一下</strong></div><div><span><kbd>P</kbd></span><strong>可选拍照，只保存本地</strong></div><div><span><kbd>Esc</kbd></span><strong>暂停 / 声音 / 离开</strong></div></div><p class=\"quiet\">有些事情走近就会发生，有些值得回头看看。<br>不需要收集全部，也没有失败。</p><button data-action=\"hud\" class=\"primary\">继续看看<span>→</span></button></section>","pause":"<div class=\"shade\"></div><section class=\"panel pause\"><div class=\"eyebrow\">店还开着。你可以慢慢来。</div><h2>休息一下</h2><div class=\"sound\"><label><span>总音量</span><input type=\"range\" aria-label=\"总音量\" data-bus=\"master\" min=\"0\" max=\"100\" value=\"85\"><output>85%</output></label><label><span>背景音乐</span><input type=\"range\" aria-label=\"背景音乐\" data-bus=\"music\" min=\"0\" max=\"100\" value=\"45\"><output>45%</output></label><label><span>事件与交互</span><input type=\"range\" aria-label=\"事件与交互\" data-bus=\"event\" min=\"0\" max=\"100\" value=\"80\"><output>80%</output></label><label><span>环境声音</span><input type=\"range\" aria-label=\"环境声音\" data-bus=\"ambience\" min=\"0\" max=\"100\" value=\"60\"><output>60%</output></label></div><div class=\"buttons\"><button data-action=\"hud\" class=\"primary\">继续看看<span>→</span></button><button data-action=\"help\" >操作说明<span>→</span></button><button data-action=\"leave\" >离开场景<span>→</span></button></div><p class=\"quiet small\">声音设置只控制游戏音量。场景没有计时器。</p></section>","photo":"<div class=\"photo-title\"><span class=\"small-square\"></span>拍个本地纪念<span>照片不会自动上传</span></div><div class=\"frame\"><i></i><i></i><i></i><i></i></div><div class=\"photo-buttons\"><button id=\"toggleUI\"><img alt=\"\" src=\"Sprites/I3_Icon_Eye.png\">隐藏 UI</button><button data-action=\"saved\" class=\"primary\"><img alt=\"\" src=\"Sprites/I3_Icon_Save.png\">保存到本地</button><button id=\"copyText\"><img alt=\"\" src=\"Sprites/I3_Icon_Copy.png\">复制文案</button><button data-action=\"hud\">返回 <kbd>P</kbd></button></div><p class=\"photo-note\">此处仅为界面状态预览；实际截图写盘由技术接入。</p>","saved":"<div class=\"location\"><span class=\"small-square\"></span><span data-location>L1 · 便民店初访</span></div><div class=\"cross\"><img alt=\"\" src=\"Sprites/I3_Crosshair.png\"></div><div class=\"toast\"><img alt=\"\" src=\"Sprites/I3_Icon_Check.png\"><div><strong>照片已保存到本地</strong><small>示例：Pictures / ThisStore / photo.png</small></div><button data-action=\"hud\" aria-label=\"关闭提示\">×</button></div><div class=\"bottom\"><span><kbd>Tab</kbd> 看操作</span><span><kbd>P</kbd> 拍照　<kbd>Esc</kbd> 暂停</span></div>","leave":"<div class=\"shade\"></div><section class=\"panel leave\"><div class=\"eyebrow\">随时进来，随时离开。</div><h2>要换个地方吗<i>？</i></h2><p class=\"quiet\">没看完也没关系，随时可以回来。<br>没有分数，没有必须完成的清单。</p><div class=\"buttons\"><button data-action=\"title\" class=\"primary\">换个地方看看<span>→</span></button><button data-action=\"hud\" >再待一会儿<span>→</span></button><button data-action=\"title\" >返回标题<span>→</span></button></div><p class=\"quiet small\">离开无需“通关”，也不要求先拍照。</p></section>"},levels=[{"id":"L1","name":"便民店初访","kind":"第一眼就能看见","description":"门一开，熟悉的小店先露出一点不对劲。","gag_count":4,"complexity":"obvious single-object observations","bgm":"I3_BGM_NightShift_Main","editable_blend":"../01_场景与模型/Levels/L1_便民店初访/L1_便民店初访.blend","scene_manifest":"../01_场景与模型/Levels/L1_便民店初访/scene-manifest.json","runtime_scene_key":"L1"},{"id":"L2","name":"后仓夜游","kind":"转个角，再回头","description":"挪一步，换个方向，普通物件各有想法。","gag_count":5,"complexity":"corner and look-back observations","bgm":"I3_BGM_NightShift_Quiet","editable_blend":"../01_场景与模型/Levels/L2_后仓夜游/L2_后仓夜游.blend","scene_manifest":"../01_场景与模型/Levels/L2_后仓夜游/scene-manifest.json","runtime_scene_key":"L2"},{"id":"L3","name":"整店不对劲","kind":"这次不只一个","description":"一个小动静，让整间店互相接了话。","gag_count":5,"complexity":"multi-object chains with readable local feedback","bgm":"I3_BGM_ColdAir","editable_blend":"../01_场景与模型/Levels/L3_整店不对劲/L3_整店不对劲.blend","scene_manifest":"../01_场景与模型/Levels/L3_整店不对劲/scene-manifest.json","runtime_scene_key":"L3"}];let level='L1';const ui=document.querySelector('.ui');function show(id){ui.classList.remove('hidden-tools');ui.innerHTML=screens[id]||screens.hud;document.body.dataset.view=id;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===id));document.querySelectorAll('[data-location]').forEach(e=>e.textContent=level+' · '+levels.find(l=>l.id===level).name);document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>show(b.dataset.action));document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=b.dataset.level;show('hud')});document.querySelectorAll('input[type=range]').forEach(b=>b.oninput=()=>b.nextElementSibling.textContent=b.value+'%');const t=document.querySelector('#toggleUI');if(t)t.onclick=()=>{ui.classList.toggle('hidden-tools');t.lastChild.textContent=ui.classList.contains('hidden-tools')?'显示 UI':'隐藏 UI'};const c=document.querySelector('#copyText');if(c)c.onclick=async()=>{try{await navigator.clipboard.writeText('今天一切正常。只是这店不太对。');c.textContent='文案已复制'}catch{c.textContent='今天一切正常。只是这店不太对。'}}}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));const q=new URLSearchParams(location.search);if(q.has('capture'))document.querySelector('.wrap').classList.add('capture');if(levels.some(l=>l.id===q.get('level')))level=q.get('level');show(q.get('view')||'title');function resize(){document.querySelector('.stage').style.transform='scale('+document.querySelector('.holder').clientWidth/1920+')'}resize();addEventListener('resize',resize);addEventListener('keydown',e=>{if(document.activeElement.tagName==='INPUT')return;if(e.key==='Tab'){e.preventDefault();show(document.body.dataset.view==='help'?'hud':'help')}if(e.key==='Escape')show(document.body.dataset.view==='pause'?'hud':'pause');if(e.key.toLowerCase()==='p')show(document.body.dataset.view==='photo'?'hud':'photo')});</script></body></html>
